name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1" "pnpm@10.33.0"

      - name: Verify tag and package version match
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "${RELEASE_TAG}" = "v${package_version}"

      - name: Install the release layout
        run: npm install --install-links=true

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build and verify the exact package artifact
        id: package
        shell: bash
        run: |
          patterns="$RUNNER_TEMP/privacy-denylist.json"
          artifact="$RUNNER_TEMP/verified-package.tgz"
          node tools/extract-privacy-denylist.mjs --output "$patterns"
          npm run build
          node tools/pack-and-verify.mjs \
            --patterns-file "$patterns" \
            --output "$artifact"
          echo "patterns=$patterns" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Publish the verified artifact with npm Trusted Publishing
        env:
          LARK_BRIDGE_PRIVACY_DENYLIST_FILE: ${{ steps.package.outputs.patterns }}
        run: npm publish "${{ steps.package.outputs.artifact }}" --access public --tag latest
