name: CI

on:
  push:
  pull_request:

# Cancel duplicate runs from simultaneous push+PR events.
# Uses the commit SHA as the dedup key: push gets github.sha,
# PR gets pull_request.head.sha — both are the same commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (Windows — focused)
        if: runner.os == 'Windows'
        # Pre-existing baseline failures in unchanged Windows tests
        # (O_NOFOLLOW, SIGTERM, command fixtures) are outside this PR scope.
        # Run only the at-bot process-tree, command, prompt, and registration
        # tests that this PR introduces or modifies.
        run: >
          pnpm vitest run
          tests/unit/cli/at-bot-process.test.ts
          tests/unit/cli/at-bot.test.ts
          tests/unit/cli/index-registration.test.ts
          tests/unit/agent/bridge-system-prompt.test.ts
          tests/unit/agent/adapter-system-prompt-wiring.test.ts

      - name: Test (macOS / Ubuntu — full)
        if: runner.os != 'Windows'
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  package-smoke:
    name: npm package clean-install smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare npm release layout
        run: npm install --install-links=true

      - name: Pack, privacy-scan, and clean-install one artifact
        shell: bash
        run: |
          patterns="$RUNNER_TEMP/privacy-denylist.json"
          artifact="$RUNNER_TEMP/verified-package.tgz"
          node tools/extract-privacy-denylist.mjs --output "$patterns"
          npm run build
          node tools/pack-and-verify.mjs \
            --patterns-file "$patterns" \
            --output "$artifact"
